name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Pin the package library inside the workspace so actions/cache can find it.
      R_LIBS_USER: ${{ github.workspace }}/.r-lib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Prepare R library path
        run: |
          mkdir -p "$R_LIBS_USER"
          echo "$R_LIBS_USER" >> "$GITHUB_PATH" >/dev/null 2>&1 || true
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"

      # System libraries needed by some Bioconductor/CRAN packages when a P3M
      # binary is unavailable for a given R version and the package compiles
      # from source. Notably SpatialExperiment (a GSVA dependency) compiles from
      # source and links ImageMagick (libMagick++), so without libmagick++-dev
      # the whole GSVA -> IOBR -> smoke-test chain fails.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libcairo2-dev libpng-dev libxt-dev \
            libglpk-dev libgmp-dev libharfbuzz-dev libfribidi-dev \
            libfontconfig1-dev libfreetype6-dev libtiff5-dev libjpeg-dev \
            libmagick++-dev librsvg2-dev libhdf5-dev libudunits2-dev libgdal-dev

      # Cache the R package library so dependency installs are incremental
      # across runs. Keyed on the install script + R version; a change to
      # install_dependencies.R busts the cache and reinstalls cleanly.
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-deps-${{ hashFiles('install_dependencies.R') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-deps-
            ${{ runner.os }}-r-deps-

      # Single source of truth: reuse the project's own installer so CI and
      # local installs never drift. It handles CRAN/Bioc/R-Forge(estimate)/
      # GitHub(IOBR) with the correct per-source repos.
      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript install_dependencies.R

      - name: Run smoke test
        run: Rscript examples/run_demo_smoke_test.R

      # On any failure, upload the demo outputs and logs so the exact error is
      # inspectable from the Actions UI without re-running.
      - name: Upload smoke-test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-outputs
          if-no-files-found: ignore
          path: |
            examples/demo_logs/**
            examples/demo_RNAseq_General/**
            examples/demo_RNAseq_limma_voom/**
            examples/demo_RNAseq_WGCNA/**
            examples/demo_RNAseq_TME/**
            examples/demo_RNAseq_TimeCourse/**
            examples/demo_RNAseq_TCGA_GEO/**
          retention-days: 7

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Validate all notebooks and R scripts
        run: Rscript tests/validate_notebooks.R
