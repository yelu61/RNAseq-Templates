name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::jsonlite
            any::knitr
            any::rmarkdown
          extra-packages: |
            any::BiocManager
            bioc::DESeq2
            bioc::clusterProfiler
            bioc::org.Mm.eg.db
            bioc::ComplexHeatmap
            bioc::circlize
            bioc::matrixStats
            bioc::EnhancedVolcano
            bioc::GSVA
            bioc::msigdbr
            bioc::DOSE
            bioc::enrichplot
            bioc::limma
            bioc::edgeR
            bioc::SummarizedExperiment
            bioc::GEOquery
            bioc::Mfuzz
            bioc::WGCNA
            bioc::survival
            any::ashr
            any::ggrepel
            any::data.table
            any::pheatmap
            any::ggpubr
            any::tidyverse
            any::RColorBrewer
            any::openxlsx
            any::UpSetR
            any::corrplot
            any::e1071
            any::babelgene
            any::rprojroot
            any::survminer
            any::estimate
            github::IOBR/IOBR

      - name: Run smoke test
        run: Rscript examples/run_demo_smoke_test.R

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Validate all notebooks and R scripts
        run: Rscript tests/validate_notebooks.R
